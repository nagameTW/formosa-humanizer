name: 新的 AI 痕跡
description: 現有模式抓不到的 AI 寫作痕跡。
labels: ["enhancement"]
body:
  - type: textarea
    id: before
    attributes:
      label: 範例
      description: 真的出現過這種痕跡的文字。私人資訊請先拿掉。
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 真人會怎麼寫
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 為什麼現有模式抓不到
      description: 寫出最接近的模式編號，說明它漏掉了什麼。大部分新痕跡其實能併進現有模式。
    validations:
      required: true
